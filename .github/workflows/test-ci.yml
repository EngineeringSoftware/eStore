name: Test CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"
          cache: maven

      - name: Install test-data tools
        run: sudo apt-get update && sudo apt-get install -y wget zstd

      - name: Install estore and test the codegen plugin
        run: |
          mvn -pl estore -am install -DskipTests -Djacoco.skip=true
          mvn -pl estore-maven-plugin install

      - name: Build and test estore
        run: mvn -f estore -Pcompile-queries clean test jacoco:report

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: estore/target/site/jacoco/
          if-no-files-found: ignore
