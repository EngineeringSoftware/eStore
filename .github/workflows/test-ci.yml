name: Test CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"
          cache: maven

      - name: Install test-data tools
        run: sudo apt-get update && sudo apt-get install -y wget zstd

      - name: Install codegen plugin
        run: mvn -pl estore-maven-plugin -am install -DskipTests -Djacoco.skip=true

      - name: Rewrite annotated queries
        run: mvn -pl estore org.estore:estore-maven-plugin:1.0-SNAPSHOT:codegen

      - name: Build and test estore
        run: mvn -pl estore clean test jacoco:report

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: estore/target/site/jacoco/
          if-no-files-found: ignore
