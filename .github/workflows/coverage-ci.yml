name: Coverage CI

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenJDK 8 and test-data tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-8-jdk wget zstd
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Check coverage
        run: mvn -pl estore clean test jacoco:report jacoco:check -Dmaven.compiler.release=8
