name: Coverage CI

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"
          cache: maven

      - name: Install test-data tools
        run: sudo apt-get update && sudo apt-get install -y wget zstd

      - name: Install codegen plugin
        run: mvn -pl estore-maven-plugin -am install -DskipTests -Djacoco.skip=true

      - name: Rewrite annotated queries
        run: mvn -pl estore org.estore:estore-maven-plugin:1.0-SNAPSHOT:codegen

      - name: Check coverage
        run: mvn -pl estore clean test jacoco:report jacoco:check
